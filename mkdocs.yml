site_name: SAR Drone Build Log
site_description: Honest notes on building an aerial casualty-location proof of concept
site_author: Joseph Kim
site_url: https://josephkim05.github.io/sar-drone-blog/
repo_url: https://github.com/JosephKim05/sar-drone-blog

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}

plugins:
  - search
  - blog

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - "Ch 1: Search Path": chapter-1-search-path/index.md
  - "Ch 2: Person Detection": chapter-2-person-detection/index.md
  - Blog:
      - blog/index.md
  - Glossary: glossary.md
  - Limits: limits.md
  - About: about.md
